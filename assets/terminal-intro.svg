<svg width="900" height="320" viewBox="0 0 900 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Martin Mayer terminal intro</title>
  <desc id="desc">Animated terminal style introduction showing Martin Mayer, MSc Robotics at EPFL, his focus areas, and project names.</desc>
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .panel { fill: #111827; stroke: #30363d; stroke-width: 1; }
      .tab { fill: #161b22; }
      .title { fill: #c9d1d9; font: 600 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .dim { fill: #8b949e; font: 15px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .prompt { fill: #58a6ff; font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .cmd { fill: #c9d1d9; font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .out { fill: #7ee787; font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .body { fill: #c9d1d9; font: 16px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; }
      .cursor { fill: #7ee787; }
    </style>
    <clipPath id="clip1"><rect x="146" y="74" width="0" height="22"><animate attributeName="width" values="0;90;90" keyTimes="0;0.08;1" dur="10s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="clip2"><rect x="146" y="129" width="0" height="22"><animate attributeName="width" values="0;140;140" keyTimes="0;0.23;1" dur="10s" begin="0.9s" repeatCount="indefinite" /></rect></clipPath>
    <clipPath id="clip3"><rect x="146" y="220" width="0" height="22"><animate attributeName="width" values="0;110;110" keyTimes="0;0.18;1" dur="10s" begin="3.1s" repeatCount="indefinite" /></rect></clipPath>
  </defs>

  <rect class="bg" width="900" height="320" rx="16"/>
  <rect class="panel" x="16" y="16" width="868" height="288" rx="14"/>
  <rect class="tab" x="16" y="16" width="868" height="36" rx="14"/>
  <circle cx="40" cy="34" r="6" fill="#ff5f56"/>
  <circle cx="60" cy="34" r="6" fill="#ffbd2e"/>
  <circle cx="80" cy="34" r="6" fill="#27c93f"/>
  <text class="title" x="120" y="39">martin@epfl-robotics:~</text>

  <!-- command 1 -->
  <text class="prompt" x="36" y="90">➜ ~</text>
  <g clip-path="url(#clip1)"><text class="cmd" x="146" y="90">whoami</text></g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.09;0.28;0.29" dur="10s" repeatCount="indefinite"/>
    <text class="out" x="36" y="118">Martin Mayer — MSc Robotics @ EPFL</text>
  </g>

  <!-- command 2 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.15;0.66;0.67" dur="10s" repeatCount="indefinite"/>
    <text class="prompt" x="36" y="145">➜ ~</text>
  </g>
  <g clip-path="url(#clip2)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.15;0.66;0.67" dur="10s" repeatCount="indefinite"/>
    <text class="cmd" x="146" y="145">cat profile_focus.txt</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.23;0.24;0.66;0.67" dur="10s" repeatCount="indefinite"/>
    <text class="body" x="36" y="174">Learning-Based Control · Autonomous Systems</text>
    <text class="body" x="36" y="198">Embedded Robotics · Reinforcement Learning</text>
  </g>

  <!-- command 3 -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.32;0.95;0.96" dur="10s" repeatCount="indefinite"/>
    <text class="prompt" x="36" y="236">➜ ~</text>
  </g>
  <g clip-path="url(#clip3)" opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.31;0.32;0.95;0.96" dur="10s" repeatCount="indefinite"/>
    <text class="cmd" x="146" y="236">ls projects/</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.40;0.41;0.95;0.96" dur="10s" repeatCount="indefinite"/>
    <text class="out" x="36" y="266">sola-uav/  tensegrity-rl/  legged-robots/  haptic-control/</text>
  </g>

  <!-- final prompt + blinking cursor -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.48;0.49;1" dur="10s" repeatCount="indefinite"/>
    <text class="prompt" x="36" y="292">➜ ~</text>
    <rect class="cursor" x="146" y="279" width="10" height="16">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.3;0.5;0.8;1" dur="1s" begin="4.9s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>