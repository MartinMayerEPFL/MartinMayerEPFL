<svg xmlns="http://www.w3.org/2000/svg" width="900" height="335" viewBox="0 0 900 335" role="img" aria-label="Martin Mayer — animated terminal introduction">
<title>Martin Mayer | Robotics at EPFL</title>
<desc>Terminal commands type out one by one, followed by Martin Mayer's background, interests, and projects.</desc>
<style>
text{font:16px Consolas,'Liberation Mono',monospace}
.prompt{fill:#58a6ff}.cmd{fill:#e6edf3}.val{fill:#c9d1d9}.good{fill:#7ee787}
.cursor{fill:#7ee787}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
</style>
<defs>
 <clipPath id="c1"><rect x="128" y="64" width="0" height="23"><animate attributeName="width" from="0" to="66" dur=".75s" begin=".35s" fill="freeze" calcMode="discrete" /></rect></clipPath>
 <clipPath id="c2"><rect x="128" y="150" width="0" height="23"><animate attributeName="width" from="0" to="185" dur="1.5s" begin="2.2s" fill="freeze" calcMode="discrete" /></rect></clipPath>
 <clipPath id="c3"><rect x="128" y="236" width="0" height="23"><animate attributeName="width" from="0" to="125" dur="1.1s" begin="4.7s" fill="freeze" calcMode="discrete" /></rect></clipPath>
</defs>
<rect width="900" height="335" rx="16" fill="#0d1117"/>
<rect x="14" y="14" width="872" height="307" rx="14" fill="#111827" stroke="#30363d"/>
<path d="M28 14H872Q886 14 886 28V49H14V28Q14 14 28 14Z" fill="#161b22"/>
<circle cx="38" cy="31" r="6" fill="#ff5f57"/><circle cx="59" cy="31" r="6" fill="#febc2e"/><circle cx="80" cy="31" r="6" fill="#28c840"/>
<text x="119" y="38" fill="#c9d1d9" font-weight="bold">martin@epfl-robotics:~</text>
<text x="36" y="82" class="prompt">➜ ~</text>
<g clip-path="url(#c1)"><text x="128" y="82" class="cmd">whoami</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="1.2s" fill="freeze"/><text x="36" y="109" class="good">Martin Mayer</text><text x="36" y="132" class="val">MSc Robotics @ EPFL</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="2.1s" fill="freeze"/><text x="36" y="168" class="prompt">➜ ~</text></g>
<g clip-path="url(#c2)"><text x="128" y="168" class="cmd">cat interests.txt</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="3.9s" fill="freeze"/><text x="36" y="195" class="val">Reinforcement Learning · Control · Autonomous Systems</text><text x="36" y="218" class="val">Embedded Robotics · Hardware Integration</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="4.6s" fill="freeze"/><text x="36" y="254" class="prompt">➜ ~</text></g>
<g clip-path="url(#c3)"><text x="128" y="254" class="cmd">ls projects/</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6s" fill="freeze"/><text x="36" y="281" class="good">sola-uav/  tensegrity-rl/  legged-robots/  haptic-control/</text></g>
<g opacity="0"><set attributeName="opacity" to="1" begin="6.6s" fill="freeze"/><text x="36" y="309" class="prompt">➜ ~</text><rect x="128" y="295" width="10" height="17" class="cursor"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></rect></g>
</svg>